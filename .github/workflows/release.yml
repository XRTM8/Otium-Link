name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '22'

jobs:
  verify:
    name: Verify version consistency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Check version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          node scripts/check-version.mjs "$RELEASE_TAG"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows installer and portable
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Build Windows Executables
        shell: pwsh
        run: |
          npm run tauri:build -- --bundles nsis

      - name: Stage Windows Artifacts
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if ($setup) {
            Copy-Item $setup.FullName "release/OtiumLink_${env:VERSION}_x64-setup.exe"
          }
          $exe = 'src-tauri/target/release/otium-link.exe'
          if (Test-Path $exe) {
            Copy-Item $exe "release/OtiumLink_${env:VERSION}_x64-portable.exe"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*

  android:
    name: Build Android APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"
          yes | sdkmanager --licenses > /dev/null || true
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - run: npm ci

      - name: Configure Keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore_dir="src-tauri/gen/android/app"
          mkdir -p "$keystore_dir"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_dir/release.jks"
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
              > "$keystore_dir/keystore.properties"
          else
            echo "::warning ::No ANDROID_KEYSTORE_BASE64 secret provided. Proceeding with unsigned / debug keystore build."
          fi

      - name: Build Android APK (Per-ABI Split for minimal file size)
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npx tauri android build --apk --split-per-abi

      - name: Package Release Assets
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          echo "Searching for generated release APKs..."
          find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk"

          while IFS= read -r apk; do
            [ -z "$apk" ] && continue
            name="$(basename "$apk")"
            dir="$(basename "$(dirname "$(dirname "$apk")")")"
            abi=""
            case "$dir" in
              arm64*) abi="arm64-v8a" ;;
              arm*) abi="armeabi-v7a" ;;
              x86_64*) abi="x86_64" ;;
              x86*) abi="x86" ;;
              *)
                case "$name" in
                  *arm64-v8a*) abi="arm64-v8a" ;;
                  *armeabi-v7a*) abi="armeabi-v7a" ;;
                  *x86_64*) abi="x86_64" ;;
                  *x86*) abi="x86" ;;
                  *arm64*) abi="arm64-v8a" ;;
                  *arm*) abi="armeabi-v7a" ;;
                esac
                ;;
            esac
            if [ -n "$abi" ]; then
              echo "Packaging $apk as OtiumLink_${VERSION}_${abi}.apk"
              cp "$apk" "release/OtiumLink_${VERSION}_${abi}.apk"
            else
              cp "$apk" "release/OtiumLink_${VERSION}_universal.apk"
            fi
          done < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk")

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release/*

  publish:
    name: Publish GitHub Release
    needs: [verify, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-android
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: Otium Link ${{ needs.verify.outputs.version }}
          body: "Official release ${{ needs.verify.outputs.tag }} of Otium Link — Local-first Universal Bridge."
          files: release/*
          draft: false
          prerelease: false
          make_latest: true
