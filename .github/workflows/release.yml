name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '22'

jobs:
  verify:
    name: Verify version consistency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Check version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          node scripts/check-version.mjs "$RELEASE_TAG"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows installer and portable
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Build Windows Executables
        shell: pwsh
        run: |
          npm run tauri:build -- --bundles nsis

      - name: Stage Windows Artifacts
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if ($setup) {
            Copy-Item $setup.FullName "release/OtiumLink_${env:VERSION}_x64-setup.exe"
          }
          $exe = 'src-tauri/target/release/otium-link.exe'
          if (Test-Path $exe) {
            Copy-Item $exe "release/OtiumLink_${env:VERSION}_x64-portable.exe"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*

  android:
    name: Build Android APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Installing SDK packages (attempt $attempt/3)..."
            if sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"; then
              echo "SDK packages installed successfully."
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Error: Failed to install Android SDK packages after 3 attempts."
              exit 1
            fi
            echo "sdkmanager download interrupted. Retrying in 5s..."
            sleep 5
          done
          yes | sdkmanager --licenses > /dev/null || true
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - run: npm ci

      - name: Configure Keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore_dir="src-tauri/gen/android/app"
          mkdir -p "$keystore_dir"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_dir/release.jks"
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
              > "$keystore_dir/keystore.properties"
          else
            echo "ERROR: Missing ANDROID_KEYSTORE_BASE64 secret. Release APK must be signed."
            exit 1
          fi

      - name: Build signed APKs (Per-ABI Split and Universal)
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npx tauri android build --apk --split-per-abi
          npx tauri android build --apk

      - name: Package Release Assets
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          echo "Searching for generated release APKs..."
          found=0
          while IFS= read -r apk; do
            [ -z "$apk" ] && continue
            name="$(basename "$apk")"
            dir="$(basename "$(dirname "$(dirname "$apk")")")"
            case "$dir" in
              arm64*) abi="arm64-v8a" ;;
              arm*) abi="armeabi-v7a" ;;
              x86_64*) abi="x86_64" ;;
              x86*) abi="x86" ;;
              universal*) abi="universal" ;;
              *)
                case "$name" in
                  *arm64-v8a*) abi="arm64-v8a" ;;
                  *armeabi-v7a*) abi="armeabi-v7a" ;;
                  *x86_64*) abi="x86_64" ;;
                  *x86*) abi="x86" ;;
                  *universal*) abi="universal" ;;
                  *) echo "Skipping unrecognised APK: $apk"; continue ;;
                esac
                ;;
            esac
            echo "Packaging $apk as OtiumLink_${VERSION}_${abi}.apk"
            cp "$apk" "release/OtiumLink_${VERSION}_${abi}.apk"
            found=$((found + 1))
          done < <(find src-tauri/gen/android/app/build/outputs/apk -path '*/release/*.apk' -print)
          if [ "$found" -eq 0 ]; then
            echo 'No release APKs were produced.'
            exit 1
          fi
          ls -lh release/*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release/*

  publish:
    name: Publish GitHub Release
    needs: [verify, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-android
          path: release

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: Otium Link v${{ needs.verify.outputs.version }}
          body: |
            Official production release of Otium Link — The sovereign, local-first universal bridge between desktop and mobile.

            ### Overhaul Highlights (v1.6.0)
            - **Signed & Verified Android Distributables:** Fully signed with official Otium keystore (v1, v2, v3 schemes) ensuring seamless installation on all Android devices with zero parse/security errors.
            - **Universal & Split APK Distribution:** Provides both optimized per-ABI APKs (`arm64-v8a`, `armeabi-v7a`, `x86_64`) and a guaranteed `universal.apk` for all devices.
            - **Native Destination Exploration:** Instant "Show in Folder" (`FolderOpen`) action on transfer cards to reveal received files directly in Windows Explorer.
            - **Direct Pairing & Self-IP Hub:** Dedicated connection card displaying local IP and port for frictionless manual connect across AP-isolated networks.
            - **Strict Offline Sovereignty:** Zero cloud telemetry, zero proxy servers, pure P2P LAN encryption and streaming.
            - **GPL-3.0 Licensed:** Free open-source software forever.
          files: release/*
          draft: false
          prerelease: false
          make_latest: true
