[package]
name = "otium-link"
version = "0.1.0"
description = "A silent, local-first universal bridge for clipboard and file sync between PC and Phone"
authors = ["XRTM8"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "otium_link_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-opener = "2"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
opt-level = "s"
